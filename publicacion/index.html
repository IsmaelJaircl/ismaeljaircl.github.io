<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Servicio: Mi Ministerio — Publicaciones</title>
    <meta name="description" content="Abre esta publicación directamente en la app Mi Servicio: Mi Ministerio.">
    <meta property="og:title" content="Mi Servicio: Mi Ministerio — Publicaciones">
    <meta property="og:description" content="Abre esta publicación directamente en la aplicación Mi Servicio: Mi Ministerio.">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.35);
            --dark-950: #0b132b;
            --dark-900: #0f172a;
            --dark-800: #1e293b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --white: #ffffff;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: radial-gradient(120% 90% at 50% 10%, #1a1035 0%, #0b132b 50%, #070c18 100%);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Luces ambientales */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: orbFloat 10s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #7b6ef6, transparent 70%);
            top: -120px;
            right: -100px;
        }

        .ambient-orb-2 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #2563eb, transparent 70%);
            bottom: -100px;
            left: -80px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        /* Tarjeta Glassmorphism */
        .card-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 32px;
            padding: 44px 32px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Icono de la App */
        .app-icon-wrap {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, #6b21a8, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 30px rgba(124, 58, 237, 0.45);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: iconPulse 3.5s ease-in-out infinite;
        }

        .app-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-icon-fallback {
            font-size: 42px;
            line-height: 1;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 14px 30px rgba(124, 58, 237, 0.4); }
            50% { box-shadow: 0 18px 45px rgba(124, 58, 237, 0.65); }
        }

        /* Nombre de la app */
        .app-badge-name {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 22px;
        }

        /* Nombre de la publicación */
        .pub-name {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, #e0c3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.01em;
        }

        .pub-detail {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Estado cargando */
        .status-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 26px;
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 600;
            min-height: 28px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Botón de apertura directa */
        .btn-primary-open {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 22px;
            border: none;
            border-radius: 18px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            background: linear-gradient(135deg, #7c3aed, #6b21a8);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 12px;
        }

        .btn-primary-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(124, 58, 237, 0.6);
            background: linear-gradient(135deg, #8b5cf6, #6b21a8);
        }

        /* Botones de Tiendas */
        .store-buttons {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            animation: fadeUp 0.4s ease forwards;
        }

        .store-buttons.visible {
            display: flex;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-store {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 13px 20px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .btn-store:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn-store svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Divisor */
        .divider {
            display: none;
            align-items: center;
            gap: 12px;
            margin: 20px 0 14px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .divider.visible {
            display: flex;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
        }

        /* Botón jw.org y retorno */
        .btn-jw {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .btn-jw.visible {
            display: flex;
        }

        .btn-jw:hover {
            color: #ffffff;
        }

        .back-home-link {
            display: block;
            margin-top: 18px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-home-link:hover {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Luces ambientales -->
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>

    <main class="card-container">
        <!-- Icono Oficial -->
        <div class="app-icon-wrap">
            <img src="../assets/images/nuevo_app_icon.png" alt="Icono Mi Servicio" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="app-icon-fallback" style="display:none;">📚</div>
        </div>

        <div class="app-badge-name">Mi Servicio: Mi Ministerio</div>

        <!-- Nombre de la Publicación Dinámica -->
        <h1 class="pub-name" id="pubName">Publicación</h1>
        <div class="pub-detail" id="pubDetail">Abre este material en tu app</div>

        <!-- Estado de apertura automática -->
        <div class="status-box" id="status">
            <div class="spinner"></div>
            <span>Abriendo en Mi Servicio…</span>
        </div>

        <!-- Botón Manual de Apertura Directa -->
        <a href="#" class="btn-primary-open" id="btnOpen" style="display:none;" onclick="tryOpen()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Abrir en Mi Servicio
        </a>

        <!-- Botones de Descarga en Tiendas (Fallback) -->
        <div class="store-buttons" id="storeButtons">
            <a href="https://apps.apple.com/us/app/servicio-jw-mi-ministerio/id6770139586" target="_blank" rel="noopener" class="btn-store" id="btnApple">
                <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/></svg>
                Descargar en App Store
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.ismaelcastroluna.juegosbiblicos&pcampaignid=web_share" target="_blank" rel="noopener" class="btn-store" id="btnGoogle">
                <svg viewBox="0 0 24 24"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 01-.61-.92V2.734a1 1 0 01.609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.302 2.302c.7.7.7 1.68 0 2.38l-2.302 2.302L15.396 12l2.302-2.492zM5.864 3.471l10.937 6.333-2.302 2.302-8.635-8.635z"/></svg>
                Descargar en Google Play
            </a>
        </div>

        <div class="divider" id="divider">O</div>

        <!-- Enlace auxiliar a jw.org -->
        <a href="#" target="_blank" rel="noopener" class="btn-jw" id="btnJw">
            🌐 Ver en jw.org
        </a>

        <!-- Volver al portal oficial -->
        <a href="../index.html" class="back-home-link">← Ir a la página oficial</a>
    </main>

    <script>
        // ─── Mapa de códigos de publicación a nombres legibles ───
        const PUB_NAMES = {
            'lff': 'Disfrute de la vida para siempre',
            'lffi': 'Disfrute de la vida para siempre (interactivo)',
            'nwt': 'Traducción del Nuevo Mundo',
            'w': 'La Atalaya',
            'wp': 'La Atalaya (pública)',
            'g': '¡Despertad!',
            'mwb': 'Vida y Ministerio Cristianos',
            'bhs': '¿Qué enseña la Biblia?',
            'bt': 'Imitemos su fe',
            'cl': 'Acerquémonos a Jehová',
            'gt': 'El hombre más grande',
            'ia': 'Imite su fe',
            'jy': 'Jesús: El camino',
            'kr': 'El Reino de Dios',
            'lfb': 'Lecciones de la Biblia',
            'od': 'Organizados',
            'rj': 'Regreso a Jehová',
            'rr': 'Rescate',
            'sjj': 'Cantemos a Jehová',
            'th': 'Escuela del ministerio',
            'yb': 'Anuario',
        };

        // ─── Leer parámetros de la URL ───
        const params = new URLSearchParams(window.location.search);
        const pubCode = params.get('pub') || '';
        const capitulo = params.get('capitulo') || '';
        const parrafo = params.get('parrafo') || '';
        const nombre = params.get('nombre') || '';

        // ─── Mostrar nombre de la publicación ───
        const displayName = nombre || PUB_NAMES[pubCode.toLowerCase()] || pubCode || 'Publicación';
        document.getElementById('pubName').textContent = displayName;

        let detailParts = [];
        if (capitulo) detailParts.push(`Capítulo ${capitulo}`);
        if (parrafo) detailParts.push(`Párrafo ${parrafo}`);
        document.getElementById('pubDetail').textContent = detailParts.join(' · ') || 'Lectura teocrática';

        // Título dinámico
        if (displayName) {
            document.title = `${displayName} — Mi Servicio: Mi Ministerio`;
        }

        // ─── Construir deep link hacia la app móvil ───
        function buildDeepLink() {
            let url = `serviciojw://publicacion?pub=${encodeURIComponent(pubCode)}`;
            if (capitulo) url += `&capitulo=${encodeURIComponent(capitulo)}`;
            if (parrafo) url += `&parrafo=${encodeURIComponent(parrafo)}`;
            return url;
        }

        // ─── Enlace de consulta en jw.org ───
        function buildJwLink() {
            if (pubCode) {
                return `https://www.jw.org/finder?srcid=jwlshare&wtlocale=S&prefer=lang&pub=${pubCode}`;
            }
            return 'https://www.jw.org/es/';
        }
        document.getElementById('btnJw').href = buildJwLink();

        let appOpened = false;

        function tryOpen() {
            const deepLink = buildDeepLink();
            window.location.href = deepLink;
            setTimeout(showFallback, 2000);
        }

        function showFallback() {
            if (appOpened) return;
            document.getElementById('status').style.display = 'none';
            document.getElementById('btnOpen').style.display = 'inline-flex';
            document.getElementById('storeButtons').classList.add('visible');
            document.getElementById('divider').classList.add('visible');
            document.getElementById('btnJw').classList.add('visible');
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) appOpened = true;
        });

        window.addEventListener('blur', function() {
            appOpened = true;
        });

        if (pubCode) {
            tryOpen();
        } else {
            showFallback();
        }
    </script>
</body>
</html>
